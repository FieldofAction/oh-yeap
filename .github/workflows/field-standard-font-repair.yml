name: Stage Field Standard font repair
on:
  push:
    branches: [design/field-standard-typography]
    paths: ['.github/workflows/field-standard-font-repair.yml']
permissions:
  contents: write
jobs:
  stage-one-line-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source and prepare exactly one deletion
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('src/styles/main.css')
          original=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
          assert sha=='3b6412e2eeba4bacd1e55ebd63f27c72c6a5c698', 'Source moved; do not patch blindly'
          rule=b"@font-face{font-family:'Space Mono';font-style:normal;font-weight:400 700;font-display:swap;src:local('Space Mono')}\n"
          assert original.count(rule)==1
          revised=original.replace(rule,b'',1)
          pathlib.Path('/tmp/foa-font-repair.json').write_text(json.dumps({'content':revised.decode('utf-8'),'encoding':'utf-8'}))
          print('Verified original blob',sha)
          print('Removed only the local-only Space Mono face; Google Fonts and family assignments remain unchanged.')
          PY
      - name: Stage blob only; no branch or production writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/FieldofAction/oh-yeap/git/blobs --input /tmp/foa-font-repair.json --jq '"STAGED_FONT_REPAIR_BLOB=" + .sha'
          rm /tmp/foa-font-repair.json
