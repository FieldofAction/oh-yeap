  function normalizePath(p) {
    p = String(p).trim();
    if (p.charAt(0) !== '/') { p = '/' + p; }
    p = p.split('#')[0].split('?')[0];
    if (p.length > 1) { p = p.replace(/\/+$/, ''); }
    return p.toLowerCase();
  }

  /* A lab URL for a simulated path, keeping the lab switches. */
  function labUrl(p, extra, hash) {
    var q = new URLSearchParams();
    q.set('path', p);
    KEEP.forEach(function (k) { if (params.get(k) === '1') { q.set(k, '1'); } });
    Object.keys(extra || {}).forEach(function (k) {
      if (extra[k] === null) { q.delete(k); } else { q.set(k, extra[k]); }
    });
    /* Slashes stay readable in the address bar: ?path=/journal/... */
    return location.pathname + '?' + q.toString().replace(/%2F/gi, '/') + (hash || '');
  }

  /* A port of the /collabs page script: year headings, the upcoming
     tag, empty links and the filter pills. */
  function collabsScript() {
    var FAMILIES = [['lager', 'Lagers & pils'], ['pale', 'Pale, blonde & wheat'], ['ipa', 'IPA'], ['belgian', 'Belgian & farmhouse'], ['dark', 'Dark & strong'], ['barrelflow', 'Barrel & Flow']];
    var page = document.querySelector('[data-collabs-page]');
    if (!page) { return; }
    var list = page.querySelector('.w-dyn-items');
    var items = Array.prototype.slice.call(list.querySelectorAll('.w-dyn-item'));
    var years = [], famsSeen = {};
    items.forEach(function (item) {
      var row = item.querySelector('.sm-co');
      var upcoming = /upcoming/i.test(row.querySelector('.sm-co-status').textContent);
      if (upcoming) { row.setAttribute('data-co-upcoming', '1'); }
      var ym = row.querySelector('.sm-co-data-date').textContent.match(/\b(?:19|20)\d{2}\b/);
      var year = upcoming ? 'next' : (ym ? ym[0] : '');
      item.setAttribute('data-co-year', year);
      if (year && years.indexOf(year) < 0) { years.push(year); }
      var fams = row.querySelector('.sm-co-data-fams').textContent.toLowerCase().split(/\s+/).filter(Boolean);
      item.setAttribute('data-co-fams', ' ' + fams.join(' ') + ' ');
      fams.forEach(function (f) { famsSeen[f] = 1; });
      Array.prototype.forEach.call(row.querySelectorAll('.sm-co-link'), function (a) {
        a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener');
      });
      if (!row.querySelector('.sm-co-link')) { row.querySelector('.sm-co-links').setAttribute('data-co-none', '1'); }
    });
    var heads = {};
    function count(n) { return n + (n === 1 ? ' beer' : ' beers'); }
    years.forEach(function (y) {
      var first = list.querySelector('.w-dyn-item[data-co-year="' + y + '"]');
      var n = list.querySelectorAll('.w-dyn-item[data-co-year="' + y + '"]').length;
      var h = document.createElement('div');
      h.className = 'sm-co-year';
      h.setAttribute('data-co-year', y);
      h.setAttribute('role', 'presentation');
      h.appendChild(document.createElement('span')).textContent = y === 'next' ? 'In progress' : y;
      h.appendChild(document.createElement('small')).textContent = count(n);
      list.insertBefore(h, first);
      heads[y] = h;
    });
    var none = document.createElement('div');
    none.className = 'sm-co-none';
    none.textContent = 'Nothing brewed in that one yet.';
    none.hidden = true;
    list.parentNode.appendChild(none);
    var bar = page.querySelector('[data-co-filters]');
    var pills = [];
    function pill(key, label) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sm-co-pill'; b.textContent = label;
      b.setAttribute('data-co-f', key);
      b.setAttribute('aria-pressed', key === 'all' ? 'true' : 'false');
      b.addEventListener('click', function () { apply(key); });
      bar.appendChild(b); pills.push(b);
    }
    function sep() { var s = document.createElement('span'); s.className = 'sm-co-sep'; bar.appendChild(s); }
    var navEl = document.getElementById('anchor');
    function dock() { if (navEl && navEl.offsetHeight) { bar.style.top = Math.round(navEl.getBoundingClientRect().height) + 'px'; } }
    dock(); window.addEventListener('resize', dock); window.addEventListener('load', dock);
    pill('all', 'All'); sep();
    years.forEach(function (y) { if (y !== 'next') { pill('y:' + y, y); } });
    var famKeys = FAMILIES.filter(function (f) { return famsSeen[f[0]]; });
    if (famKeys.length) { sep(); }
    famKeys.forEach(function (f) { pill('f:' + f[0], f[1]); });
    function apply(key) {
      var shown = 0, perYear = {};
      items.forEach(function (item) {
        var ok = key === 'all' ||
          (key.indexOf('y:') === 0 && item.getAttribute('data-co-year') === key.slice(2)) ||
          (key.indexOf('f:') === 0 && item.getAttribute('data-co-fams').indexOf(' ' + key.slice(2) + ' ') > -1);
        item.classList.toggle('sm-co-hide', !ok);
        if (ok) { shown++; var y = item.getAttribute('data-co-year'); perYear[y] = (perYear[y] || 0) + 1; }
      });
      Object.keys(heads).forEach(function (y) {
        heads[y].classList.toggle('sm-co-hide', !perYear[y]);
        if (perYear[y]) { heads[y].lastChild.textContent = count(perYear[y]); }
      });
      none.hidden = shown > 0;
      pills.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-co-f') === key ? 'true' : 'false'); });
    }
  }

  var STORIES = {
    'back-to-basics': { eyebrow: 'Capsule 01 / Shop', title: 'Back to Basics', img: IMG.capsule,
      deck: 'Our first capsule starts with the essentials: two tees, a hat, and a tote. Things to make part of your everyday.',
      meta: ['October 8, 2026', 'Words: Soul Mega'], close: 'Wear it out.', related: ['See the capsule', SHOP],
      body: "<p><em>[Lead image: The existing capsule artwork or a composed photograph of the collection.]</em></p><p>Our first capsule begins with four familiar pieces: the Ambassador Tee, the Embody Greatness Tee, the Soul Mega Dad Hat, and the Soul Mega Tote.</p><p>We are calling it Back to Basics.</p><p>The idea is to start with things that have a natural place in someone’s day. A T-shirt you reach for without planning an outfit around it. A hat by the door. A bag that comes along because there is always something to carry.</p><p>We wanted a starting point that was easy to live with.</p><h2>An everyday place for Soul Mega</h2><p>Starting with essentials puts a useful constraint on the design. The pieces need to work with what you already wear. The identity should feel present without taking over. A basic earns its place by being something you want to use again.</p><p>The tees use regular-fit crewneck shapes; the hat has an adjustable buckle closure. Familiar forms give us room to focus on how Soul Mega shows up on them.</p><p>Embody Greatness belongs here, too. We think of it as an invitation to bring intention to what you do, including the ordinary parts of a day. On a piece of clothing, it becomes something you can take with you.</p><p><em>[Image break: The tees worn in an everyday setting, with supporting details of the hat and tote.]</em></p><p>There is another part of making a collection that interests us: what happens once it leaves our hands.</p><p>We can choose the pieces and make the designs. You decide what they go with, where they travel, and which one becomes a regular. That part cannot be designed in advance.</p><p>It is also what makes clothing feel personal. Over time, an object becomes connected to the person using it, rather than only the company that made it.</p><p>For this first release, that feels like a good ambition. A few essentials, a clear expression of Soul Mega, and enough room for you to make them yours.</p>" },

  function hourET() {
    try {
      return Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date())) % 24;

  function onAir(h, p) { return p.start < p.end ? h >= p.start && h < p.end : h >= p.start || h < p.end; }

  function hours(p) {
    var a = clock(p.start), b = clock(p.end);
    return (a.slice(-2) === b.slice(-2) ? a.slice(0, -3) : a) + '–' + b + ' ET';
  }

  function markusScript() {
    var form = document.querySelector('.mk-form');
    if (!form) { return; }
    var input = form.querySelector('.mk-input');
    var log = document.querySelector('.mk-log');
    function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
    input.addEventListener('input', grow);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) { return; }
      input.value = ''; grow();
      [['you', text], ['markus', 'Lab stand-in. Markus is not connected in the lab, so nothing was sent.']].forEach(function (m) {
        var p = document.createElement('p');
        p.className = 'mk-msg'; p.setAttribute('data-who', m[0]); p.textContent = m[1];
        log.appendChild(p);
      });
    });
  }

  function notFoundPage() {
    return '<div class="utility-page-wrap"><div class="utility-page-content"><h2>Page Not Found</h2><div>The page you are looking for doesn&#x27;t exist or has been moved</div></div></div>';
  }

  var PAGES = {
    '/': { id: 'gate', css: ['gate'], chrome: false, body: 'body-2', html: gatePage },
    '/home-enter': { id: 'home', css: ['home'], chrome: true, body: 'body', html: homePage, after: heroScript },
    '/beer': { id: 'beer', css: ['beer'], chrome: true, body: '', html: beerPage },
    '/collabs': { id: 'collabs', css: ['collabs'], chrome: true, body: '', html: collabsPage, after: collabsScript },
    '/events': { id: 'events', css: ['events'], chrome: true, body: 'body', html: eventsPage },
    '/journal': { id: 'journal', css: ['journal'], chrome: true, body: '', html: journalPage },
    '/radio': { id: 'radio', css: ['radio'], chrome: true, body: '', html: radioPage, late: buildRadio },
    '/find-us': { id: 'find-us', css: ['find-us'], chrome: true, body: 'body', html: findUsPage, after: stockistScript },
    '/contact-us': { id: 'contact', css: ['contact'], chrome: true, body: 'body', html: contactPage },
    '/markus': { id: 'markus', css: ['markus'], chrome: true, body: '', html: markusPage, after: markusScript }
  };
  Object.keys(STORIES).forEach(function (slug) {
    PAGES['/journal/' + slug] = { id: 'story', css: ['story'], chrome: true, body: '', html: function () { return storyPage(slug); } };
  });
  var NOT_FOUND = { id: 'not-found', css: [], chrome: false, body: '', html: notFoundPage };
  var page = PAGES[path] || NOT_FOUND;

  /* ---------------- Page scripts ---------------- */

  function heroScript() {
    var viewport = document.querySelector('.sm-featuring-viewport');
    var dots = Array.prototype.slice.call(document.querySelectorAll('.sm-featuring-dot'));
    if (!viewport || !dots.length) { return; }
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var current = 0, paused = false;
    function go(i) {
      current = (i + dots.length) % dots.length;
      viewport.scrollTo({ left: viewport.clientWidth * current, behavior: still ? 'auto' : 'smooth' });
      dots.forEach(function (d, k) { d.classList.toggle('is-active', k === current); });
    }
    dots.forEach(function (d, i) {
      d.addEventListener('click', function () { go(i); });
      d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(i); } });
    });
    viewport.addEventListener('scroll', function () {
      var i = Math.round(viewport.scrollLeft / Math.max(1, viewport.clientWidth));
      dots.forEach(function (d, k) { d.classList.toggle('is-active', k === i); });
      current = i;
    }, { passive: true });
    /* The live home page authors a break point for display words wider than
       a phone's measure, and only arms it when the word overflows. */
    var BREAKS = { experienceship: 10, snallygaster: 6 };
    var titles = Array.prototype.slice.call(document.querySelectorAll('.sm-featuring-title'));
    titles.forEach(function (h) { h.setAttribute('data-smlab-raw', h.innerHTML); });
    function armBreaks() {
      titles.forEach(function (h) {
        h.innerHTML = h.getAttribute('data-smlab-raw');
        h.style.overflowWrap = 'normal';
        var over = h.scrollWidth > h.clientWidth + 1;
        h.style.overflowWrap = '';
        if (!over) { return; }
        h.innerHTML = h.innerHTML.replace(/[A-Za-z]{10,}/g, function (w) {
          var at = BREAKS[w.toLowerCase()];
          return at ? w.slice(0, at) + '<wbr>' + w.slice(at) : w;
        });
      });
    }
    armBreaks();
    window.addEventListener('resize', armBreaks);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(armBreaks); }
    var hero = document.getElementById('hero');
    hero.addEventListener('pointerenter', function () { paused = true; });
    hero.addEventListener('pointerleave', function () { paused = false; });
    if (!still) { setInterval(function () { if (!paused && !document.hidden) { go(current + 1); } }, 8000); }
  }

  function stockistScript() {
    Array.prototype.forEach.call(document.querySelectorAll('.stockist-search-filter-checkbox input'), function (box) {
      box.addEventListener('change', function () {
        box.parentNode.toggleAttribute('data-on', box.checked);
      });
    });
  }

  /* Webflow's mobile menu, as far as the module can see it: the button
     gets w--open, the menu moves into a visible .w-nav-overlay, and the
     page stops scrolling. */
  function mobileMenu() {
    var btn = document.querySelector('.moose-menu-button');
    var overlay = document.querySelector('.w-nav-overlay');
    var menu = document.querySelector('.moose-nav-menu');
    if (!btn || !overlay || !menu) { return; }
    var home = menu.parentNode;
    function set(open) {
      btn.classList.toggle('w--open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) { overlay.appendChild(menu); menu.setAttribute('data-nav-menu-open', ''); overlay.style.display = 'block'; }
      else { home.insertBefore(menu, home.firstChild.nextSibling); menu.removeAttribute('data-nav-menu-open'); overlay.style.display = ''; }
      document.documentElement.style.overflow = open ? 'hidden' : '';
    }
    btn.addEventListener('click', function () { set(!btn.classList.contains('w--open')); });
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); } });
    menu.addEventListener('click', function (e) { if (e.target.closest('a')) { set(false); } });
  }

  /* ---------------- Build ---------------- */

  var root = document.documentElement;
  root.setAttribute('data-smlab-page', page.id);
  root.setAttribute('data-smlab-nav', page.chrome ? 'site' : 'none');
  /* Webflow serves its Not Found page, with this page id, at any unknown URL. */
  if (page === NOT_FOUND) { root.setAttribute('data-wf-page', '6453ed5461b41bff64488513'); }
  document.title = 'Soul Mega capture lab · ' + path;
  Array.prototype.forEach.call(document.querySelectorAll('style[data-smlab-css]'), function (s) {
    s.media = page.css.indexOf(s.getAttribute('data-smlab-css')) > -1 ? 'all' : 'not all';
  });
  /* The footer component carries the embed stylesheet, so pages
     without the footer (/ and 404) do not get it. */
  document.getElementById('smlab-embed').media = page.chrome ? 'all' : 'not all';
  document.body.className = page.body;
  document.body.insertAdjacentHTML('afterbegin', (page.chrome ? nav() : '') + page.html() + (page.chrome ? footer() : ''));

  /* ---------------- Module configuration ---------------- */

  var config = { lab: true, dryRun: true, api: '/api', path: path, configUrl: './config.json' };
  if (params.get('fast') === '1') { config.flyout = { engagedSeconds: 6, scrollMinSeconds: 3 }; }
  if (params.get('down') === '1') { config.simulate = 'unavailable'; }
  window.SM_CAPTURE_CONFIG = config;

  /* ---------------- Event log (listening before the module loads) ---------------- */

  var LOG_MAX = 50;
  var entries = [];
  var seq = 0;
  var renderLog = function () {};
  var renderState = function () {};

  function labLog(kind, detail) {
    entries.unshift({ id: ++seq, t: new Date(), kind: kind, detail: detail, open: kind === 'response' });
    if (entries.length > LOG_MAX) { entries.length = LOG_MAX; }
    renderLog();
  }
  ['smcap:track', 'smcap:request', 'smcap:response'].forEach(function (type) {
    document.addEventListener(type, function (e) { labLog(type.slice(6), e.detail); });
  });
  document.addEventListener('smcap:state', function (e) { renderState(e.detail); });

  /* ---------------- Routing inside the lab ---------------- */

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.closest('#smlab')) { return; }
    var href = a.getAttribute('href');
    if (href === '#' || href === '#request' || href === '#gallery') { e.preventDefault(); return; }
    if (href.charAt(0) !== '/' || href.charAt(1) === '/') { return; }
    e.preventDefault();
    var u = new URL(href, 'https://www.soulmega.com');
    var target = normalizePath(u.pathname);
    if (PAGES[target]) {
      location.assign(labUrl(target, null, u.hash));
    } else {
      labLog('lab', { message: 'Not simulated in the lab: ' + target });
    }
  });

  /* Belt and braces: no form on these mock pages may submit natively.
     The module stops the footer submit itself (capture phase); anything
     that reaches the document unhandled is stopped here, and the page's
     CSP (form-action 'none') would block it regardless. */
  document.addEventListener('submit', function (e) {
    if (e.defaultPrevented) { return; }
    e.preventDefault();
    var f = e.target;
    labLog('lab', { message: 'Native form submit blocked by the lab', form: f.id || f.className || 'form' });
  });

  /* ---------------- Page behaviour ---------------- */

  mobileMenu();
  if (page.after) { page.after(); }
  if (page.late) {
    var runLate = function () { setTimeout(page.late, 300); };
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', runLate); } else { runLate(); }
  }

  /* ---------------- QA panel ---------------- */

  var LIST = ['/', '/home-enter', '/beer', '/collabs', '/events', '/journal', '/journal/a-little-something-for-dc', '/radio', '/find-us', '/contact-us', '/markus'];
  var mobile = window.matchMedia('(max-width: 767px)');
  var UI_KEY = 'smlab:open:' + (mobile.matches ? 'm' : 'd');

  function readOpen() {
    try {
      var v = localStorage.getItem(UI_KEY);
      if (v === '1') { return true; }
      if (v === '0') { return false; }
    } catch { /* storage unavailable */ }
    return !mobile.matches;
  }
  function writeOpen(v) {
    try { localStorage.setItem(UI_KEY, v ? '1' : '0'); } catch { /* storage unavailable */ }
  }

  var panel = document.createElement('div');
  panel.id = 'smlab';
  panel.setAttribute('role', 'complementary');
  panel.setAttribute('aria-label', 'Capture lab controls');
  panel.setAttribute('data-open', readOpen() ? 'true' : 'false');
  panel.innerHTML = '' +
    '<div class="smlab-bar"><button type="button" class="smlab-toggle" aria-controls="smlab-body">Lab</button>' +
      '<span class="smlab-title">Soul Mega capture</span><span class="smlab-ver" data-smlab="ver">module loading</span></div>' +
    '<div class="smlab-body" id="smlab-body">' +
      '<div class="smlab-status" data-smlab="status"></div>' +
      '<div class="smlab-sec"><div class="smlab-h">Pages</div><div class="smlab-pages" data-smlab="pages"></div></div>' +
      '<div class="smlab-sec"><div class="smlab-h">Actions</div><div class="smlab-actions">' +
        '<button type="button" data-act="open">Show flyout now</button>' +
        '<button type="button" data-act="reset">Reset state</button>' +
        '<a class="smlab-btn" data-toggle="down"></a>' +
        '<a class="smlab-btn" data-toggle="fast"></a>' +
        '<a class="smlab-btn" data-link="preview">Preview mode</a>' +
        '<a class="smlab-btn" data-link="subscriber">Arrive as subscriber</a>' +
      '</div></div>' +
      '<details class="smlab-sec"><summary class="smlab-h">State</summary><pre data-smlab="state">(module not loaded)</pre></details>' +
      '<div class="smlab-sec"><div class="smlab-h">Events <span data-smlab="count">0</span><button type="button" data-act="clear">Clear</button></div><div class="smlab-log" data-smlab="log"></div></div>' +
    '</div>';
  document.body.appendChild(panel);

  function $(k) { return panel.querySelector('[data-smlab="' + k + '"]'); }

  var footForm = document.querySelector('.footer .form-block');
  if (footForm && window.IntersectionObserver) {
    new IntersectionObserver(function (es) {
      panel.toggleAttribute('data-tuck', es[0].isIntersecting && !mobile.matches);
    }, { threshold: 0.25 }).observe(footForm);
  }
  var toggle = panel.querySelector('.smlab-toggle');
  function syncToggle() { toggle.setAttribute('aria-expanded', panel.getAttribute('data-open')); }
  syncToggle();
  toggle.addEventListener('click', function () {
    var open = panel.getAttribute('data-open') !== 'true';
    panel.setAttribute('data-open', open ? 'true' : 'false');
    writeOpen(open);
    syncToggle();
  });

  LIST.forEach(function (p) {
    var a = document.createElement('a');
    a.href = labUrl(p);
    a.textContent = p;
    if (p === path) { a.setAttribute('aria-current', 'page'); }
    $('pages').appendChild(a);
  });

  [['down', 'Simulate API down'], ['fast', 'Fast triggers']].forEach(function (t) {
    var on = params.get(t[0]) === '1';
    var a = panel.querySelector('[data-toggle="' + t[0] + '"]');
    var extra = {}; extra[t[0]] = on ? null : '1';
    a.href = labUrl(path, extra);
    a.textContent = t[1] + ': ' + (on ? 'on' : 'off');
    a.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  panel.querySelector('[data-link="preview"]').href = labUrl(path, { sm_cap: 'preview' });
  panel.querySelector('[data-link="subscriber"]').href = labUrl(path, { sm_sub: '1' });

  function api() { return window.SoulMegaCapture; }

  panel.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) { return; }
    var act = b.getAttribute('data-act');
    if (act === 'clear') { entries.length = 0; renderLog(); return; }
    if (act === 'open') {
      if (api() && typeof api().open === 'function') { api().open(); refreshState(); }
      else { labLog('lab', { message: 'SoulMegaCapture.open() is not available' }); }
      return;
    }
    if (act === 'reset') {
      try { if (api() && typeof api().reset === 'function') { api().reset(); } } catch { /* reload below regardless */ }
      [window.localStorage, window.sessionStorage].forEach(function (store) {
        try {
          Object.keys(store).forEach(function (k) { if (k.indexOf('smcap:') === 0) { store.removeItem(k); } });
        } catch { /* storage unavailable */ }
      });
      location.replace(labUrl(path));
    }
  });

  function stringify(v) {
    try { return JSON.stringify(v, null, 2); } catch { return String(v); }
  }
  function short(u) {
    return String(u || '').replace(/^https?:\/\/[^/]+/, '').replace(/^\/api\//, '');
  }
  function summary(en) {
    var d = en.detail || {};
    if (en.kind === 'track') {
      return [d.e, d.p, d.c, d.x, d.n !== undefined ? 'n=' + d.n : ''].filter(Boolean).join(' ');
    }
    if (en.kind === 'request') {
      var ep = String(d.endpoint || d.url || d.action || '');
      return [d.method || (/jsonp/i.test(ep) ? 'JSONP' : 'POST'), short(ep), d.dryRun ? 'dry run, held in the lab' : ''].filter(Boolean).join(' ');
    }
    if (en.kind === 'response') {
      var j = d.json || {};
      return [d.status, short(d.endpoint || d.url), j.status, j.error, j.dryRun ? 'dry run' : '', Array.isArray(j.plan) ? 'plan ' + j.plan.length : ''].filter(Boolean).join(' · ');
    }
    return d.message || '';
  }
  function stamp(t) { return t.toTimeString().slice(0, 8); }

  renderLog = function () {
    var box = $('log');
    $('count').textContent = String(entries.length);
    box.textContent = '';
    if (!entries.length) {
      var empty = document.createElement('div');
      empty.className = 'smlab-empty';
      empty.textContent = 'Waiting for smcap:track, smcap:request and smcap:response events.';
      box.appendChild(empty);
      return;
    }
    entries.forEach(function (en) {
      var det = document.createElement('details');
      det.className = 'smlab-entry';
      det.setAttribute('data-kind', en.kind);
      det.open = en.open;
      det.addEventListener('toggle', function () { en.open = det.open; });
      var sum = document.createElement('summary');
      var t = document.createElement('span');
      t.className = 'smlab-t';
      t.textContent = stamp(en.t) + ' ';
      var k = document.createElement('b');
      k.textContent = en.kind + ' ';
      sum.appendChild(t); sum.appendChild(k); sum.appendChild(document.createTextNode(summary(en)));
      var pre = document.createElement('pre');
      pre.textContent = stringify(en.detail);
      det.appendChild(sum); det.appendChild(pre);
      box.appendChild(det);
    });
  };

  renderState = function (s) {
    if (s === undefined && api() && typeof api().state === 'function') {
      try { s = api().state(); } catch (e) { s = { error: String(e) }; }
    }
    if (s !== undefined) { $('state').textContent = stringify(s); }
  };
  function refreshState() { renderState(); }

  function renderStatus() {
    var w = window.innerWidth, h = window.innerHeight;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var parts = [
      '<b>' + esc(path) + '</b>' + (PAGES[path] ? '' : ' (404 page)'),
      w + '×' + h + ' ' + (w < 768 ? 'mobile' : 'desktop'),
      'dry run, api /api',
      params.get('down') === '1' ? '<span class="smlab-warn">API down simulated</span>' : '',
      params.get('fast') === '1' ? 'fast triggers' : '',
      params.get('sm_cap') ? 'sm_cap=' + esc(params.get('sm_cap')) : '',
      reduce ? 'reduced motion' : ''
    ].filter(Boolean);
    $('status').innerHTML = parts.join(' · ');
    var sm = api();
    $('ver').textContent = sm ? 'v' + (sm.version || '?') : (window.__smlabMissing ? 'sm-capture.js missing' : 'module loading');
    $('ver').className = 'smlab-ver' + (!sm && window.__smlabMissing ? ' smlab-warn' : '');
  }

  renderLog();
  renderStatus();
  window.addEventListener('resize', renderStatus);
  window.addEventListener('load', function () { renderStatus(); refreshState(); });
  document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { renderStatus(); refreshState(); }, 0); });
  setInterval(function () { renderStatus(); refreshState(); }, 2000);
})();
</script>
<script src="./sm-capture.js" onerror="window.__smlabMissing = true"></script>
</body>
</html>
