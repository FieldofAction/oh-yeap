<style>

    -webkit-font-smoothing: antialiased;
    padding: 0 20px 80px;
  }
  .root.spirit { --accent: #E8B84B; }
  .shell { max-width: 760px; margin: 0 auto; }

  /* Three columns so the lens pill stays optically centred whatever the back

    gap: 12px; padding: 40px 0 26px; }

  /* The path back to the site, matching the Atlas's .foa-back in position and

    padding: 15px; margin: -15px; }
  .foa-back:hover { color: var(--fg); }
  .foa-back:focus-visible { outline: 2px solid var(--stroke2); outline-offset: 3px; border-radius: 2px; }

  .chip { position: absolute; top: 14px; left: 14px;

  .marker { position: absolute; display: flex; align-items: center; justify-content: center;

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* Frosted pill input over the image. Its height is keyed to the plate's

  .prompt { position: absolute; left: 50%; bottom: 43%; transform: translateX(-50%);

<script>
// ————————————————————————————————————————————————
// THE OZ INDEX — Version C4 · "Emerald"
// Field of Action · Cultural Infrastructure Instrument 002
//
// Register: Apple / OpenAI. System type, near-black
// canvas, frosted pills, hairline strokes. The cleaned
// plate runs as the hero; the trace field floats over
// it as a frosted pill. Kansas idle = desaturated print;
// resolve = the color bloom.
//
// Self-contained, on the Atlas pattern: no build step, no
// imports. Two routes, neither holding a key in the page:
//   /api/generate  — the trace, and the generated key art
//   /api/poster    — TMDB theatrical poster lookup
// ————————————————————————————————————————————————

// The hero plate is in the markup with a preload hint, so it starts loading
// before this script runs. Its path lives there, not here.

// Marker track along the road in the hero (% coords, t=0 at the travelers →
// t=1 in the foreground). The trace walks toward the viewer: step 1 stands with
// the travelers, the last step arrives at the film under examination.
//
// The span starts at 61% because the pill sits at 50-57% and a marker behind
// frosted glass reads as a smudge. x values are sampled from the road's own
// centreline, so re-fit both columns together if the plate is ever replaced.
const TRACK = [ [51,61],[49.8,68.5],[49.2,76],[48.6,83.5],[48,91] ];

const trackPoint = (t) => {
  const segs = TRACK.length - 1;
  const f = Math.min(0.9999, Math.max(0, t)) * segs;
  const i = Math.floor(f);
  const u = f - i;
  const [x1, y1] = TRACK[i];
  const [x2, y2] = TRACK[i + 1];
  return { x: x1 + (x2 - x1) * u, y: y1 + (y2 - y1) * u };
};

const SOURCE_CANON = `
Core frame: every story has an exoteric reading (the surface plot,
general knowledge) and an esoteric reading (the inner teaching,
secret knowledge). Oz is a map of the individual's journey of
unfoldment — the work of Self-knowledge.
Stations: the tornado is awakening; the yellow brick road is the
golden path of unfoldment; the companions are faculties reclaimed
(mind, heart, will); the witch is the lower self dissolved by
truth; the curtain is false external authority revealed; the
return is the recognition that the Self was never absent.
`;

const MODES = {
  film: {
    label: "Film",
    sub: "Every film since 1939 carries a thread back to The Wizard of Oz. Name one and the instrument traces it.",
    placeholder: "Name any film",
    strengthLabel: "Thread",
    deepCutLabel: "Deep cut",
    counterLabel: "Counterpoint",
    tracingLine: "Tracing",
    categories: {
      STRUCTURE: "Home–away–home, the companioned quest",
      IMAGE: "Technicolor logic, the threshold cut",
      ICON: "Slippers, tornado, curtain, road",
      PERSONNEL: "Direct human lineage of craft",
      SOUND: "Over the Rainbow and its echoes",
      "DIRECT CITATION": "Explicit homage or quotation",
    },
  },
  spirit: {
    label: "Spirit",
    sub: "Every film restages a station of the inner journey Oz encoded. Name one and the instrument reads it esoterically.",
    placeholder: "Name any film",
    strengthLabel: "Resonance",
    deepCutLabel: "Transmission",
    counterLabel: "Sober note",
    tracingLine: "Walking",
    categories: {
      AWAKENING: "The tornado — disruption that initiates",
      "THE PATH": "The golden road of unfoldment",
      COMPANIONS: "Mind, heart, courage — faculties reclaimed",
      SHADOW: "The witch — the lower self confronted",
      "THE CURTAIN": "False authority revealed; power was within",
      "THE RETURN": "No place like home — the Self recognized",
    },
  },
};

const buildPrompt = (mode, title) => {
  const shared = `Respond with ONLY a valid JSON object, no markdown fences, no preamble:`;
  if (mode === "film") {
    return `You are the reasoning engine inside "The Oz Index," an instrument testing the thesis that every film since 1939 carries a traceable connective thread back to Victor Fleming's THE WIZARD OF OZ.

The film under examination: "${title}"

Trace the strongest genuine connective thread from The Wizard of Oz (1939) to this film. Be a rigorous film historian, not a hype machine. Threads may run through structure (home–away–home, the companioned quest, the dream frame), image (Technicolor logic, threshold transitions, production design), iconography (slippers, tornado, curtain, road), personnel (direct lineage of cast, crew, craft), sound (Over the Rainbow, the I-want song), or direct citation (homage, quotation, parody).

Honesty rules: strong threads get evidence; mediated threads get the actual chain; thin threads get a low rating and an honest counterpoint — do not inflate. If the title is not a real film, set "recognized" to false.

${shared}
{
  "recognized": true,
  "film": { "title": "corrected full title", "year": "YYYY", "director": "name" },
  "thesis": "One sharp sentence stating the connective thread.",
  "category": "one of: STRUCTURE, IMAGE, ICON, PERSONNEL, SOUND, DIRECT CITATION",
  "strength": 1,
  "road": [
    { "step": 1, "title": "3-6 word label", "detail": "1-2 sentences. Start at Oz." },
    { "step": 2, "title": "...", "detail": "..." },
    { "step": 3, "title": "...", "detail": "End at the film under examination." }
  ],
  "deepCut": "One specific, lesser-known connection.",
  "counterpoint": "One honest sentence on the limit of this thread. Empty string only if airtight."
}
"strength" is an integer 1-5. "road" has 3 to 5 steps.`;
  }
  return `You are the reasoning engine inside "The Oz Index" in SPIRIT mode — reading films through the esoteric map The Wizard of Oz (1939) encoded: the journey of unfoldment toward Self-knowledge.

Your interpretive canon:
${SOURCE_CANON}

The film under contemplation: "${title}"

Give the exoteric reading (surface plot, one sentence) and the esoteric reading (inner teaching, one sentence). Identify the single station of the Oz map this film most fully restages and trace the path through the film's actual scenes. Close reading, not horoscope. A cynical film may refuse or invert the teaching — that is a valid reading. Thin resonance gets a modest rating and a sober note. If the title is not a real film, set "recognized" to false.

${shared}
{
  "recognized": true,
  "film": { "title": "corrected full title", "year": "YYYY", "director": "name" },
  "thesis": "One sentence naming the inner teaching this film carries.",
  "category": "one of: AWAKENING, THE PATH, COMPANIONS, SHADOW, THE CURTAIN, THE RETURN",
  "strength": 1,
  "duality": { "exoteric": "Surface reading, one sentence.", "esoteric": "Inner reading, one sentence." },
  "road": [
    { "step": 1, "title": "3-6 word label", "detail": "1-2 sentences grounded in actual scenes." },
    { "step": 2, "title": "...", "detail": "..." },
    { "step": 3, "title": "...", "detail": "..." }
  ],
  "deepCut": "The one moment carrying the teaching most directly.",
  "counterpoint": "Where the reading strains. Empty string only if total."
}
"strength" is an integer 1-5. "road" has 3 to 5 steps.`;
};

const root = document.getElementById("root");
const heroEl = document.getElementById("hero");

const lensBtns = {

  spirit: document.getElementById("lens-spirit"),
};

let mode = "film";
let state = "kansas"; // kansas | tracing | oz | error
let result = null;
let genArt = null;
let artFailed = false;
let artLoading = false;
let traceToken = 0; // guards a stale trace or artwork call resolving late

const M = () => MODES[mode];

// Model output is text from a model, never markup. Everything renders
// through textContent.
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function paintChrome() {
  root.className = `root ${mode}`;
  heroEl.classList.toggle("lit", state === "oz");
  chipEl.classList.toggle("pulse", state === "tracing");
  if (state === "tracing") chipTextEl.textContent = `${M().tracingLine}…`;
  else if (state === "oz" && result) chipTextEl.textContent = `Oz → ${result.film.title}`;
  else chipTextEl.textContent = "Kansas";
  traceBtn.disabled = state === "tracing" || !inputEl.value.trim();
  traceBtn.textContent = state === "tracing" ? "…" : "Trace";
  inputEl.disabled = state === "tracing";
}

function paintMode() {
  subEl.textContent = M().sub;
  inputEl.placeholder = M().placeholder;
  lensBtns.film.classList.toggle("active", mode === "film");
  lensBtns.spirit.classList.toggle("active", mode === "spirit");
}

function clearMarkers() {
  heroEl.querySelectorAll(".marker").forEach((m) => m.remove());
}

function reset(clearQuery) {
  traceToken++;
  state = "kansas";
  result = null;
  genArt = null;
  artFailed = false;
  artLoading = false;
  reportSlot.textContent = "";
  statusEl.className = "status";
  statusEl.textContent = "";
  clearMarkers();
  if (clearQuery) inputEl.value = "";
  paintChrome();
  inputEl.focus();
}

function switchMode(next) {
  if (next === mode) return;
  mode = next;
  reset(false);
  paintMode();
}

// ———————————————————————————————— the api

// Both calls go through the shared proxy, which forwards the body verbatim.
async function apiCall(prompt, maxTokens) {
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error((data && data.error && data.error.message) || "proxy error");
  return data;
}

const textOf = (data) =>
  ((data && data.content) || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");

const extractJson = (data) => {
  const text = textOf(data);
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start === -1 || end === -1) return null;
  try { return JSON.parse(text.slice(start, end + 1)); } catch { return null; }
};

// ———————————————————————————————— artwork, three tiers

// Tier 1: the real theatrical poster, by TMDB lookup. The handoff's original
// web-search flow is gone — a catalogue is more reliable than a model guessing
// at hotlinkable URLs.
async function fetchPoster(film, token) {
  const params = new URLSearchParams({ title: film.title || "", year: film.year || "" });
  const res = await fetch(`/api/poster?${params.toString()}`);
  if (!res.ok) return;
  const data = await res.json();
  if (!data || !data.poster || token !== traceToken) return;
  if (!result) return;
  result.keyArt = { url: data.poster, alt: `${film.title} theatrical poster` };
  paintArt();
}

// Tier 2: the instrument cuts its own. Saul Bass restraint, flat vector, and a
// hard screen on anything executable before it goes near the DOM.
async function fetchGenArt(film, category, token) {
  const prompt = `Design minimal, abstract key art for the film "${film.title}" (${film.year}, dir. ${film.director}). Its most relevant register here: ${category}. Output ONLY a complete <svg> element and nothing else. Requirements: viewBox="0 0 400 600"; flat vector shapes only (rect, circle, ellipse, polygon, path); one dominant background color drawn from the film's actual visual world; 2 to 5 foreground shapes abstracting the film's single most iconic visual motif into geometry; at most 4 colors total; no gradients, filters, images, scripts, links, animation or external references; the only text: the film title in lowercase at x="24" y="556" with font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="600", and the year at x="24" y="580" font-size="12" opacity="0.7", both in a color legible on the background. Under 30 elements. Taste: Saul Bass restraint, Apple minimalism — one idea, held.`;
  const data = await apiCall(prompt, 1500);
  if (token !== traceToken) return;
  const text = textOf(data);
  const s = text.indexOf("<svg");
  const e = text.lastIndexOf("</svg>");
  if (s === -1 || e === -1) return;
  const svg = text.slice(s, e + 6);
  const lower = svg.toLowerCase();
  const banned = ["<script", "javascript:", "onload", "onclick", "onerror", "href=", "xlink", "<image", "<foreignobject"];
  if (banned.some((b) => lower.includes(b))) return;
  genArt = svg;
  paintArt();
}

async function fetchArtwork(film, category, token) {
  artLoading = true;
  paintArt();
  await Promise.allSettled([fetchGenArt(film, category, token), fetchPoster(film, token)]);
  if (token !== traceToken) return;
  artLoading = false;
  paintArt();
}

// Tier 3 is the Edition cover, which needs no fetch: it is what the column
// holds until something better arrives, and what it keeps if nothing does.
function paintArt() {
  const col = document.getElementById("art-col");
  if (!col || !result) return;
  col.textContent = "";

  if (result.keyArt && result.keyArt.url && !artFailed) {
    const img = el("img", "keyart");
    img.src = result.keyArt.url;
    img.alt = result.keyArt.alt || `${result.film.title} key art`;
    img.addEventListener("error", () => { artFailed = true; paintArt(); });
    col.append(img, el("div", "art-cap", "Theatrical key art"));
    return;
  }

  if (genArt) {
    const img = el("img", "keyart");
    img.src = `data:image/svg+xml;utf8,${encodeURIComponent(genArt)}`;
    img.alt = `Key art for ${result.film.title}, composed by the instrument`;
    col.append(img, el("div", "art-cap", "Key art · set by the instrument"));
    return;
  }

  const edition = el("div", "edition");
  edition.append(el("div", "e-top", "The Oz Index"));
  const title = el("div", "e-title", result.film.title);
  title.append(el("em", null, `${result.film.year} · ${result.film.director}`));
  edition.append(title);
  edition.append(el("div", "e-foot", result.category));
  col.append(edition, el("div", "art-cap", artLoading ? "Composing key art…" : "Edition cover"));
}

// ———————————————————————————————— render

function paintMarkers() {
  clearMarkers();
  if (state !== "oz" || !result) return;
  const steps = result.road || [];
  const n = steps.length;
  steps.forEach((s, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const { x, y } = trackPoint(t);
    const scale = 0.72 + t * 0.42;
    const marker = el("div", "marker", String(s.step));
    marker.style.left = `${x}%`;
    marker.style.top = `${y}%`;
    marker.style.transform = `translate(-50%,-50%) scale(${scale})`;
    marker.style.animationDelay = `${(s.step - 1) * 0.3}s`;
    marker.title = s.title || "";
    heroEl.append(marker);
  });
}

function renderReport() {
  const m = M();
  const r = result;
  reportSlot.textContent = "";

  const article = el("article", "report");

  const printHead = el("div", "print-head");
  const phTop = el("div", "ph-top");
  phTop.append(el("span", null, "The Oz Index"));
  phTop.append(el("span", null, mode === "film" ? "Film lens" : "Spirit lens"));
  printHead.append(phTop);
  printHead.append(el("div", "ph-title", `Oz → ${r.film.title}`));
  article.append(printHead);

  const metaRow = el("div", "meta-row");
  const meta = el("div", "meta");
  meta.append(el("b", null, r.film.title));
  meta.append(document.createTextNode(` · ${r.film.year} · ${r.film.director}`));
  metaRow.append(meta);
  const dots = el("div", "dots");
  dots.setAttribute("aria-label", `${m.strengthLabel} ${r.strength} of 5`);
  for (let k = 1; k <= 5; k++) dots.append(el("i", k <= r.strength ? "on" : null));
  dots.append(el("span", null, m.strengthLabel));
  metaRow.append(dots);
  article.append(metaRow);

  const topCard = el("div", "card");
  const grid = el("div", "grid");
  const artCol = el("div", "art-col");
  artCol.id = "art-col";
  grid.append(artCol);

  const textCol = el("div", "text-col");
  textCol.append(el("h2", "thesis", r.thesis));
  const cat = el("div", "cat");
  cat.append(el("span", "dot"));
  cat.append(document.createTextNode(r.category));
  textCol.append(cat);
  textCol.append(el("p", "cat-note", m.categories[r.category] || ""));

  if (mode === "spirit" && r.duality) {
    const duality = el("div", "duality");
    [["Exoteric", r.duality.exoteric], ["Esoteric", r.duality.esoteric]].forEach(([k, v]) => {
      const row = el("div", "du-row");
      row.append(el("div", "du-key", k));
      row.append(el("div", "du-val", v));
      duality.append(row);
    });
    textCol.append(duality);
  }
  grid.append(textCol);
  topCard.append(grid);
  article.append(topCard);

  const journey = el("div", "card");
  journey.append(el("div", "sec-label", "The journey"));
  (r.road || []).forEach((s) => {
    const step = el("div", "step");
    step.append(el("div", "step-n", String(s.step)));
    const body = el("div");
    body.append(el("div", "step-t", s.title));
    body.append(el("p", "step-d", s.detail));
    step.append(body);
    journey.append(step);
  });
  article.append(journey);

  const cut = el("div", "card");
  cut.append(el("div", "sec-label", m.deepCutLabel));
  cut.append(el("p", "cutp", r.deepCut));
  article.append(cut);

  if (r.counterpoint) {
    const counterCard = el("div", "card counter-card");
    counterCard.append(el("div", "sec-label", m.counterLabel));
    const counter = el("div", "counter");
    counter.append(el("p", null, r.counterpoint));
    counterCard.append(counter);
    article.append(counterCard);
  }

  const actions = el("div", "actions");
  const back = el("button", "btn-ghost", "Return to Kansas");
  back.type = "button";
  back.addEventListener("click", () => reset(true));
  const print = el("button", "btn-solid", "Download PDF");
  print.type = "button";
  print.addEventListener("click", () => window.print());
  actions.append(back, print);
  article.append(actions);

  reportSlot.append(article);
  paintArt();
}

// ———————————————————————————————— trace

async function trace() {
  const title = inputEl.value.trim();
  if (!title || state === "tracing") return;

  const token = ++traceToken;
  state = "tracing";
  result = null;
  genArt = null;
  artFailed = false;
  artLoading = false;
  reportSlot.textContent = "";
  statusEl.className = "status";
  statusEl.textContent = "";
  clearMarkers();
  paintChrome();

  try {
    // Spirit carries the duality pair on top of a five-step road and has been
    // measured at 2150 output tokens; film runs ~1350. This is a ceiling, not
    // a spend, and a trace that overruns it truncates mid-JSON and fails to
    // parse — so the headroom is deliberate.
    const data = await apiCall(buildPrompt(mode, title), 4000);
    if (token !== traceToken) return;
    const parsed = extractJson(data);
    if (!parsed) throw new Error("no json");
    if (!parsed.recognized) {
      state = "error";
      statusEl.className = "status err";
      statusEl.textContent = `Couldn’t find a film called “${title}”. Check the title and try again.`;
      paintChrome();
      inputEl.focus();
      return;
    }
    result = parsed;
    state = "oz";
    paintChrome();
    renderReport();
    paintMarkers();
    fetchArtwork(parsed.film || {}, parsed.category, token);
  } catch (err) {
    if (token !== traceToken) return;
    state = "error";
    statusEl.className = "status err";
    statusEl.textContent = "The trace didn’t complete. Try again.";
    paintChrome();
    inputEl.focus();
  }
}

lensBtns.film.addEventListener("click", () => switchMode("film"));
lensBtns.spirit.addEventListener("click", () => switchMode("spirit"));
traceBtn.addEventListener("click", trace);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") trace(); });
inputEl.addEventListener("input", paintChrome);

paintMode();
paintChrome();
// The trace pill sits at the foot of the hero, so a plain focus() on load
// scrolls the masthead off the top. Focus without moving the page.
inputEl.focus({ preventScroll: true });
</script>
</body>
</html>
